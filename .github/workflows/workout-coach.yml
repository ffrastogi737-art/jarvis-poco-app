name: Workout Coach CI

on:
  push:
    paths: [ "workout-coach/**", ".github/workflows/workout-coach.yml" ]
  pull_request:
    paths: [ "workout-coach/**", ".github/workflows/workout-coach.yml" ]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workout-coach/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node --test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: workout-coach
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit, database and UI (Robolectric) tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace
      - name: Print test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, re, html
          for f in glob.glob('**/build/test-results/**/TEST-*.xml', recursive=True):
              s = open(f).read()
              for m in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure message="(.*?)" type="[^"]*">(.*?)</failure>', s, re.S):
                  print("::group::FAILED", m.group(2), m.group(1))
                  print(html.unescape(m.group(4))[:4000])
                  print("::endgroup::")
          PY
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          for mod in ("core", "app"):
              t = f = sk = 0
              for x in glob.glob(f"{mod}/build/test-results/**/TEST-*.xml", recursive=True):
                  h = open(x).read(600)
                  m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', h)
                  t += int(m[1]); sk += int(m[2]); f += int(m[3]) + int(m[4])
              print(f"{mod}: {t} tests, {f} failed, {sk} skipped")
          PY
      - name: Show exported Room schema
        run: cat app/schemas/com.personal.workoutcoach.data.db.AppDatabase/1.json
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Android lint
        run: ./gradlew :app:lintDebug
      - name: Build release (unsigned unless keystore configured)
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            workout-coach/core/build/reports/tests
            workout-coach/app/build/reports
            workout-coach/app/build/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: workout-coach-apks
          path: workout-coach/app/build/outputs/apk/**/*.apk
